apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eve-online-tools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ArturSkrin/Eve-Online-Tools.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: eve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
